<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MovieFinder</title>
  <meta name="description" content="MovieFinder — search movies, filmographies and streaming availability.">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07090d;color:#f7f7f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1100px,92vw);margin:auto;padding:52px 0 80px}.brand{font-size:clamp(32px,6vw,64px);font-weight:900;letter-spacing:-.055em;margin:0}.tag{color:#a8adb7;font-size:17px;margin:8px 0 30px}.search{display:flex;gap:10px;background:#11151c;border:1px solid #272d38;border-radius:18px;padding:10px;box-shadow:0 18px 55px rgba(0,0,0,.3)}input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:17px;padding:13px 14px;min-width:0}button{border:0;border-radius:12px;padding:13px 20px;background:#fff;color:#080a0d;font-weight:800;cursor:pointer}.examples{margin:16px 4px 0;color:#777f8c;font-size:13px}.status{margin-top:28px;color:#9da4af}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-top:18px}.card{background:#11151c;border:1px solid #252b35;border-radius:16px;padding:17px}.title{font-weight:800;font-size:18px}.meta{color:#949ba7;font-size:13px;margin-top:5px}.offers{font-size:13px;margin-top:12px;color:#d7d9de}.error{color:#ff9a9a}@media(max-width:600px){.shell{padding-top:32px}.search{flex-direction:column}button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="brand">MovieFinder</h1>
    <p class="tag">Find movies, complete filmographies and where they’re streaming.</p>
    <form id="searchForm" class="search">
      <input id="query" name="q" autocomplete="off" placeholder="Try: Quentin Tarantino streaming movies" aria-label="Movie search">
      <button type="submit">Search</button>
    </form>
    <div class="examples">Examples: “all Will Smith movies” · “1994 crime movies” · “The Godfather”</div>
    <div id="status" class="status">Type what you want to watch.</div>
    <section id="results" class="grid" aria-live="polite"></section>
  </main>
<script>
const form=document.getElementById('searchForm');
const input=document.getElementById('query');
const status=document.getElementById('status');
const results=document.getElementById('results');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(items){
  results.innerHTML=items.map(item=>{
    const offers=Array.isArray(item.offers)?item.offers:[];
    const services=[...new Set(offers.map(o=>o.package?.clearName||o.package?.shortName||o.provider||o.service).filter(Boolean))];
    const roles=Array.isArray(item.roles)?item.roles:(item.role?[item.role]:[]);
    return `<article class="card"><div class="title">${esc(item.title||item.name||'Untitled')}</div><div class="meta">${esc(item.year||'')}${roles.length?` · ${esc(roles.join(', '))}`:''}</div>${services.length?`<div class="offers">Streaming: ${esc(services.join(', '))}</div>`:''}</article>`;
  }).join('');
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const q=input.value.trim();
  if(!q)return;
  status.textContent='Searching…';results.innerHTML='';
  try{
    const response=await fetch('/api/search?q='+encodeURIComponent(q));
    if(!response.ok)throw new Error('Search unavailable ('+response.status+')');
    const data=await response.json();
    const items=Array.isArray(data.results)?data.results:[];
    status.textContent=items.length?`${items.length} result${items.length===1?'':'s'}`:'No matches found.';
    render(items);
  }catch(error){status.innerHTML=`<span class="error">${esc(error.message||'Search is temporarily unavailable.')}</span>`;}
});
</script>
</body>
</html>
