name: Bug report
description: Report reproducible behavior that appears incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this project. Please include enough detail for someone else to reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, inputs, URLs, or sample data when safe.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser/runtime, version, deployment target
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens, personal data, and other secrets before posting.
