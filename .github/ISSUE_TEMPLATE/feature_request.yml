name: Feature request
description: Propose a useful, testable improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How could we verify success?
      description: Suggest tests, benchmarks, user-visible outcomes, or acceptance criteria.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — note other approaches or tradeoffs.
