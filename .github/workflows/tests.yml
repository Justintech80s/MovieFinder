name: Search Brain Tests

on:
  push:
    branches:
      - feature/search-brain-v2
      - feature/python-search-adapter
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Node tests
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r python_search/requirements.txt
      - name: Run Python contract tests
        env:
          PYTHONPATH: python_search
        run: python -m pytest python_search/tests -q
